services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    extra_hosts:
      # Built in on OrbStack/Docker Desktop; needed on Linux Docker.
      - "host.docker.internal:host-gateway"
