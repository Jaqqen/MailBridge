# Dev reverse proxy: terminates TLS and forwards plain HTTP to the Node app on the host.
#
# Certificate (once, certs/ is gitignored):
#   mkcert -ecdsa -cert-file certs/localhost.pem -key-file certs/localhost-key.pem localhost 127.0.0.1 ::1
#
# Run:   npm run proxy        (https://localhost:8443)
# Check: npm run proxy:test

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    upstream mailbridge {
        server host.docker.internal:3210;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass         http://mailbridge;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $http_host;
        }
    }
}
